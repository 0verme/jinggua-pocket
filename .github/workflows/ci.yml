---
name: CI

"on":
  push:
  pull_request:

jobs:
  native:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure native tests
        run: cmake -S test/native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native tests
        run: cmake --build build/native --config Release --parallel
      - name: Run native tests
        run: |
          ctest --test-dir build/native --build-config Release \
            --output-on-failure

  firmware:
    name: PlatformIO firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build StickS3 firmware
        run: pio run -e m5stack-sticks3

  format:
    name: Format and lint gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Check repository formatting
        run: python tools/check_format.py
