[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified.git#0.2.21
    M5PM1=https://github.com/m5stack/M5PM1.git#1.0.7
monitor_speed = 115200
extra_scripts =
    post:tools/wifi_credentials.py
    post:tools/api_config.py

[env:m5stack-sticks3-mic-research]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DJINGGUA_ENABLE_MIC_RESEARCH=1
